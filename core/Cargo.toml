[package]
name = "balatro-vs"
version = "0.1.0"
edition = "2021"

[workspace]
members = ["copy_lua_patchs"]

[lib]
name = "winmm"
crate-type = ["cdylib", "rlib"]

[features]
default = ["mlua", "webrtc", "relay"]
# Lua bridge through mlua (Windows / Android)
mlua = ["dep:mlua"]
# Lua bridge over raw C API function pointers
nx = []
# Peer to peer transport
webrtc = ["dep:matchbox_socket", "dep:futures", "dep:futures-timer"]
# Transport relayed by the signaling server over a WebSocket (Switch).
relay = ["dep:tungstenite"]
with_integrity = []
thunderstore_build = []

# [build]
# target = "i686-pc-windows-msvc"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("switch"))'] }

[build-dependencies.forward-dll]
version = "0.1.13"

[dependencies]
mlua = { version = "0.10.2", features = ["lua51", "module", "async", "macros"], optional = true }
once_cell = "1.8.0"
matchbox_socket = { git = "https://github.com/Fcornaire/matchbox", branch = "develop-bvs", optional = true }
matchbox_protocol = { git = "https://github.com/Fcornaire/matchbox", branch = "develop-bvs", features = ["json"] }
futures = { version = "0.3.31", optional = true }
futures-timer = { version = "3.0.3", optional = true }
tungstenite = { version = "0.21", default-features = false, features = ["handshake"], optional = true }
serde = "1.0.216"
serde_json = "1.0.134"
bincode = "1.3.3"
itertools = "0.14.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
time = { version = "0.3.37", features = ["formatting", "parsing"] }
rand = "0.8.5"
semver = "1.0.26"
zip = { version = "2.3.0", default-features = false, features = ["deflate"] }

[target.'cfg(not(target_os = "switch"))'.dependencies]
tokio = { version = "1.16.1", features = ["full"] }
dirs = { version = "6.0.0" }
reqwest = { version = "0.12.14", features = ["json"] }

[target.'cfg(windows)'.dependencies]
retour = { version = "0.3.1", features = ["static-detour"] }
windows = { version = "0.58.0", features = ["Win32_System_LibraryLoader"] }

[target.aarch64-linux-android.dependencies]
openssl = { version = "0.10", features = ["vendored"] }